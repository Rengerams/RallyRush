name: Windows desktop build

on:
  push:
    branches:
      - main
      - fix/audit-playability-ux
    paths:
      - "frontend/**"
      - ".github/workflows/desktop-windows.yml"
  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/desktop-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm test
      - run: npm run desktop:dist
      - uses: actions/upload-artifact@v7
        with:
          name: RENFFR-OPEN-Windows
          path: frontend/release/*.exe
          if-no-files-found: error
          retention-days: 14
