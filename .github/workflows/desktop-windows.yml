name: Windows desktop build

on:
  push:
    branches:
      - main
      - fix/audit-playability-ux
    paths:
      - "frontend/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop-windows.yml"
  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 26.12.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install chromium
      - run: npm run lint
      - run: npm test
      - run: npm run test:browser
      - run: npm run desktop:dist
      - uses: actions/upload-artifact@v7
        with:
          name: Rally-Rush-Windows
          path: frontend/release/*.exe
          if-no-files-found: error
          retention-days: 14
